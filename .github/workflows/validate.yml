name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run. Non-PR runs (push to main) get a
# unique group per run, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Runtime cap only (queue time is not counted): the job takes a few minutes; 45 is a hang guard.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Node validator is canonical and cross-platform (also runnable on Windows).
      - name: Run skill validator
        run: node scripts/cli.mjs validate
      # Runs the extraction command exactly as skills/session-restore/SKILL.md documents it (needs sh and awk).
      - name: Test session-restore extraction command
        run: node --test skills/session-restore/restore.test.mjs
      - name: Test project-audit continuity
        run: node --test skills/project-audit/scripts/check-continuity.test.mjs
      - name: Test marketing-video gates
        run: node --test skills/marketing-video/scripts/gates.test.mjs skills/marketing-video/scripts/qa.test.mjs
      - name: Test vendored security-audit validators
        run: node --test skills/security-audit/validate-findings.test.cjs skills/security-audit/validate-coverage-ledger.test.cjs

  # The library CLI links (symlinks, or junctions on Windows), copies and updates skill directories,
  # so it is tested on every OS on Node 22, the supported floor. Each test runs a temp copy of the CLI
  # against a temp home directory.
  cli:
    # Runtime cap only (queue time is not counted): cli.test.mjs takes a few minutes; 45 is a hang guard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the library CLI
        run: node --test scripts/cli.test.mjs
